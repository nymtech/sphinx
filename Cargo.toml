[package]
name = "sphinx-packet"
version = "0.1.1"
authors = ["Ania Piotrowska <ania@nymtech.net>", "Dave Hrycyszyn <futurechimp@users.noreply.github.com>", "Jędrzej Stuczyński <andrew@nymtech.net>"]
edition = "2018"
license = "Apache-2.0"
description = "A Sphinx packet implementation in Rust"
repository = "https://github.com/nymtech/sphinx"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.8.4"
ctr = "0.9.2"
bs58 = "0.5.1"
curve25519-dalek = {version = "4.1.2", features = ["legacy_compatibility"] }
hmac = "0.12.1"
digest = "0.10.7"
log = "0.4.21"
rand = "0.8.5"
rand_distr = "0.4.3"
sha2 = "0.10.8"
hkdf = "0.12.4"
lioness = "0.1.2"
arrayref = "0.3.7"
chacha = "0.3.0"
blake2 = "0.8.0" # cannot be updated due to outdated dependency inside lioness
byteorder = "1.5.0"
subtle = "2.4.1"


[dev-dependencies]
mockall = "0.12.1"
criterion = "0.5.1"

[[bench]]
name = "benchmarks"
harness = false

